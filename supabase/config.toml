project_id = "calendar-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "calendarapp://"
additional_redirect_urls = ["calendarapp://auth/callback", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development only. Confirmations are required in hosted environments.
enable_confirmations = false

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

# ---------------------------------------------------------------------------
# Edge Functions
#
# Everything defaults to requiring a user JWT. The two exceptions below are
# called by parties that do not have one, and each authenticates itself another
# way: the OAuth callback by the single-use `state` it must present, and the
# Google webhook by the channel token it echoes back.
# ---------------------------------------------------------------------------
[functions.oauth-google-callback]
verify_jwt = false

[functions.webhook-google]
verify_jwt = false

# Called by pg_cron with a shared secret, not by a signed-in user.
[functions.sync-cron]
verify_jwt = false

name: Preview build

# Manual, so a build is never spent on a PR that is not ready to be tried on a
# device. EXPO_TOKEN must be set in repository secrets.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android, all]
        default: ios

jobs:
  build:
    name: EAS preview build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/mobile
        run: eas build --profile preview --platform ${{ inputs.platform }} --non-interactive --no-wait
